name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Кодировку не задаём нарочно: тесты должны проходить и в cp1252/cp1251 Windows.
      - name: unittest
        if: hashFiles('tests/**/*.py') != ''
        run: python -m unittest -q
      # Установка во временный HOME (ЗАДАЧА-08): установщик → luna --version → --uninstall.
      - name: Установка (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/luna-home"
          mkdir -p "$HOME"
          bash install.sh
          "$HOME/.local/bin/luna" --version
          bash install.sh --uninstall
          test ! -e "$HOME/.local/bin/luna"
      - name: Установка (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "luna-local"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          .\install.bat
          & "$env:LOCALAPPDATA\Luna\bin\luna.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\install.bat --uninstall
          if (Test-Path "$env:LOCALAPPDATA\Luna\bin\luna.cmd") { exit 1 }
