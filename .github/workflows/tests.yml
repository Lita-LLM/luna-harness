name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Кодировку не задаём нарочно: тесты должны проходить и в cp1252/cp1251 Windows.
      - name: unittest
        if: hashFiles('tests/**/*.py') != ''
        run: python -m unittest -q
